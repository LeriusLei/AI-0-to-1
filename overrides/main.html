{% extends "base.html" %}
{% block extrahead %}
  {{ super() }}
  {% if page and config.site_url %}
    {% set public = config.extra.public_url %}
    <meta name="robots" content="index,follow,max-image-preview:large">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="AI 0 to 1">
    <meta property="og:title" content="{{ page.title | e }} · AI 0 to 1">
    <meta property="og:description" content="{{ config.site_description | e }}">
    <meta property="og:url" content="{{ page.canonical_url }}">
    <meta property="og:image" content="{{ public }}assets/branding/social-card.png">
    <meta name="twitter:card" content="summary_large_image">
    <script type="application/ld+json">{{ {"@context":"https://schema.org","@type":"WebSite","name":"AI 0 to 1","alternateName":["AI-0-to-1","AI Zero to One"],"url":public,"description":config.site_description,"inLanguage":["zh-Hans","en"],"license":"https://www.gnu.org/licenses/gpl-3.0.html","isAccessibleForFree":true,"sameAs":["https://github.com/LeriusLei/AI-0-to-1"]} | tojson }}</script>
  {% endif %}
{% endblock %}
